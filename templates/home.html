<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Management Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #e0e7ff 0%, #f0f4f8 100%);
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #004080;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .navbar .logo {
            color: #fff;
            font-size: 1.7rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .navbar .nav-links {
            display: flex;
            gap: 1.2rem;
        }
        .navbar .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .navbar .nav-links a:hover {
            background: #0066cc;
        }
        .hero {
            max-width: 700px;
            margin: 5rem auto 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            padding: 3rem 2.5rem;
            text-align: center;
        }
        .hero h1 {
            color: #004080;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .hero p {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
        }
        .hero .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        .hero .cta-buttons a {
            background: #004080;
            color: #fff;
            padding: 0.9rem 2.2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .hero .cta-buttons a:hover {
            background: #0066cc;
            transform: translateY(-2px) scale(1.04);
        }
        @media (max-width: 600px) {
            .hero {
                padding: 2rem 1rem;
            }
            .navbar {
                flex-direction: column;
                gap: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">WealthManager</div>
        <div class="nav-links">
            <a href="{{ url_for('users.login') }}">Login</a>
            <a href="{{ url_for('users.register') }}">Register</a>
        </div>
    </nav>
    <div class="hero">
        <h1>Welcome to WealthManager</h1>
        <p>Your all-in-one platform for managing investments, tracking performance, and optimizing your portfolio with AI-powered insights. Start your journey to financial freedom today!</p>
        <div class="cta-buttons">
            <a href="{{ url_for('users.login') }}">Login</a>
            <a href="{{ url_for('users.register') }}">Register</a>
        </div>
    </div>
</body>
</html>
